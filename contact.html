<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - SkillSwap Hub</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Security Check
        if (!localStorage.getItem('isLoggedIn') || localStorage.getItem('userRole') !== 'student') {
            window.location.href = 'index.html';
        }
        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</head>
<body>

    <nav>
        <a href="home.html" class="logo">🏠 SkillSwap Hub (Student)</a>
        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="courses.html">Courses</a>
            <a href="contact.html" class="active">Contact Us</a>
        </div>
        <button class="btn btn-outline" onclick="logout()">Logout</button>
    </nav>

    <div class="container">
        <div class="form-card">
            <h2 style="margin-bottom: 0.5rem; text-align: center;">Get in Touch</h2>
            <p style="text-align: center; color: var(--text-light); margin-bottom: 2rem;">Have a question about Skill Credits or teaching? Send us a message!</p>
            
            <div class="form-group">
                <label>Name</label>
                <input type="text" placeholder="Your full name">
            </div>
            
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="you@example.com" value="student@demo.com">
            </div>
            
            <div class="form-group">
                <label>Subject</label>
                <input type="text" placeholder="How can we help?">
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea rows="5" placeholder="Write your message here..."></textarea>
            </div>
            
            <button class="btn btn-primary" style="width: 100%" onclick="alert('Message Sent! We will get back to you soon.')">Send Message</button>
        </div>
    </div>

</body>
</html>
