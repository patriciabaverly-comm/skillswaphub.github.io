<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SkillSwap Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Small style just for the credentials hint box */
        .credentials-hint {
            background-color: #e0e7ff;
            border: 1px solid var(--primary);
            padding: 1rem;
            border-radius: 6px;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }
        .credentials-hint strong { color: var(--primary); }
    </style>
</head>
<body>

    <div class="container">
        <h1 style="text-align: center; color: var(--primary); margin-top: 2rem;">🏠 SkillSwap Hub</h1>
        
        <div class="form-card">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">Welcome Back</h2>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <!-- Single Login Button -->
            <button class="btn btn-primary" style="width: 100%; margin-bottom: 1.5rem;" onclick="processLogin()">Login</button>
            
            <p style="text-align: center;">Don't have an account? <a href="signup.html" style="color: var(--primary);">Sign Up</a></p>
            
            <!-- Demo Credentials Box -->
            <div class="credentials-hint">
                <p><strong>Testing the Demo? Use these credentials:</strong></p>
                <hr style="margin: 0.5rem 0; border: none; border-top: 1px solid var(--primary);">
                <p>👨‍🎓 <strong>Student:</strong><br>Email: student@demo.com<br>Pass: password123</p>
                <br>
                <p>👨‍🏫 <strong>Teacher:</strong><br>Email: teacher@demo.com<br>Pass: password123</p>
            </div>
        </div>
    </div>

    <script>
        function processLogin() {
            // Get the values typed into the inputs
            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            // Hardcoded Student Credentials
            const studentEmail = "student@demo.com";
            const studentPass = "password123";

            // Hardcoded Teacher Credentials
            const teacherEmail = "teacher@demo.com";
            const teacherPass = "password123";

            // Check which credentials match
            if (emailInput === studentEmail && passwordInput === studentPass) {
                // Log in as Student
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userRole', 'student');
                window.location.href = 'home.html'; // Redirects to Student Home
                
            } else if (emailInput === teacherEmail && passwordInput === teacherPass) {
                // Log in as Teacher
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userRole', 'teacher');
                window.location.href = 'teacher-stats.html'; // FIXED: Redirects to the new teacher stats page
                
            } else {
                // If neither matches, show an error
                alert('Invalid email or password! Please use the demo credentials provided below.');
            }
        }
    </script>
</body>
</html>
