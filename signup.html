<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SkillSwap Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1 style="text-align: center; color: var(--primary); margin-top: 2rem;">🏠 SkillSwap Hub</h1>
        
        <div class="form-card">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">Create an Account</h2>
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••">
            </div>
            
            <!-- Dropdown list for Student/Teacher -->
            <div class="form-group">
                <label>Register as:</label>
                <select id="role-select">
                    <option value="student">Student (Learn Skills)</option>
                    <option value="teacher">Teacher (Share Skills)</option>
                </select>
            </div>

            <button class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;" onclick="register()">Sign Up</button>
            
            <p style="text-align: center;">Already have an account? <a href="index.html" style="color: var(--primary);">Login</a></p>
        </div>
    </div>

    <script>
        function register() {
            alert("Account created! Redirecting to login...");
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
